# Front end for local runs. The same job is done in Kubernetes by the nginx
# ingress (deploy/k8s/50-ingress.yaml), so the request path is the same in both
# places: client -> nginx -> travel-next:8080.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;

  # Generation is handed off to a background goroutine, so requests are short;
  # this is headroom, not a dependency.
  proxy_read_timeout 120s;
  client_max_body_size 1m;

  upstream travel_next {
    server app:8080;
  }

  server {
    listen 8080;
    server_name _;

    # Static assets are served by the app itself; cache them at the edge.
    location /static/ {
      proxy_pass http://travel_next;
      proxy_set_header Host $host;
      expires 1h;
      add_header Cache-Control "public";
    }

    location / {
      proxy_pass http://travel_next;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
